["accessibility"]
"ui_scale" = 1.2

["bar"]

["bar"."default"]
"center" = [ "workspaces", "spacer_1", "clock", "active_window" ]
"concave_edge_corners" = true
"end" = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "session" ]
"margin_edge" = 0
"margin_ends" = 0
"radius_bottom_left" = 12
"radius_bottom_right" = 12
"radius_top_left" = 0
"radius_top_right" = 0
"scale" = 1.1
"start" = [ "launcher", "spacer_1", "group:g1" ]
"thickness" = 35
"capsule_group" = [ { "border" = "", "fill" = "on_secondary", "id" = "g1", "members" = [ "temp", "sysmon_2", "sysmon_3" ], "opacity" = 1.0, "padding" = 6.0 } ]

["shell"]
"launch_apps_as_systemd_services" = true
"polkit_agent" = true
"settings_show_advanced" = true

["shell"."greeter_sync"]
"auto_sync" = false

["shell"."panel"]
"open_near_click_control_center" = true
"session_placement" = "floating"
"session_position" = "center"

["shell"."screenshot"]
"copy_to_clipboard" = true
"save_to_file" = true
"pipe_to_command" = false

["shell"."session"]
"actions" = [ { "action" = "lock", "countdown_seconds" = 0.0, "enabled" = true, "shortcut" = "1", "variant" = "default" }, { "action" = "logout", "countdown_seconds" = 0.0, "enabled" = true, "shortcut" = "2", "variant" = "default" }, { "action" = "lock_and_suspend", "countdown_seconds" = 3.0, "enabled" = true, "shortcut" = "3", "variant" = "default" }, { "action" = "reboot", "countdown_seconds" = 3.0, "enabled" = true, "shortcut" = "4", "variant" = "default" }, { "action" = "shutdown", "countdown_seconds" = 3.0, "enabled" = true, "shortcut" = "5", "variant" = "destructive" } ]

["system"]

["system"."monitor"]
"cpu_temp_activity_threshold" = 83
"cpu_temp_critical_threshold" = 96

["theme"]
"custom_palette" = "Crimson Gold"
"mode" = "dark"
"source" = "custom"
"wallpaper_scheme" = "m3-tonal-spot"

["theme"."templates"]
"builtin_ids" = [ "hyprland", "kitty" ]
"community_ids" = [  ]

["widget"]

["widget"."clock"]
"color" = "secondary"
"format" = "{:%H:%M %A %m/%d/%y}"

["widget"."launcher"]
"color" = "secondary"

["widget"."media"]
"hide_when_no_media" = true
"title_scroll" = "on_hover"

["widget"."network"]
"color" = "secondary"

["widget"."notifications"]
"color" = "secondary"

["widget"."session"]
"color" = "error"

["widget"."spacer_1"]
"type" = "spacer"

["widget"."temp"]
"show_value" = false

["widget"."sysmon_2"]
"glyph" = "gpu-usage"
"show_value" = false
"stat" = "gpu_temp"
"type" = "sysmon"

["widget"."sysmon_3"]
"glyph" = "cpu-2"
"stat" = "ram_used"
"type" = "sysmon"

["widget"."tray"]
"capsule" = true
"capsule_fill" = "on_secondary"

["widget"."volume"]
"color" = "secondary"

["widget"."workspaces"]
"active_pill_size" = 2.5
"capsule" = true
"capsule_fill" = "on_primary"
"inactive_pill_size" = 1.0
"pill_scale" = 0.8
"show_labels" = false

["widget"."active_window"]
"enabled" = false

["audio"]
"enable_sounds" = true

["dock"]
"launcher_position" = "start"
"smart_auto_hide" = true

["weather"]
"unit" = "imperial"

["wallpaper"]

["wallpaper"."default"]
"path" = "__WALLPAPER__"
